<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Jardín del Saber · Práctica de Español 4.º</title>
<meta name="description" content="Práctica interactiva de Español para cuarto grado (MEP): fábula, leyenda, carta, ortografía, medios de comunicación y más. Defiende tu jardín respondiendo preguntas.">
<meta name="theme-color" content="#4aa63b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌻%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#7fd1ff;--sky2:#d6f3ff;
  --grass1:#58b947;--grass2:#4aa63b;--grass-d:#2e7d32;
  --soil:#6b4423;--wood:#a8702f;--wood-l:#c98f48;--wood-d:#7a4a1c;
  --cream:#fff8e1;--ink:#26331f;--ink2:#4a5a40;
  --sun:#ffd23f;--sun-d:#e0a800;
  --ok:#2e7d32;--okbg:#e3f6d8;--bad:#b3261e;--badbg:#fde7e4;--info:#0d5fa8;--infobg:#e1f1fd;
  --focus:#0b4fd1;
  --r:18px;
  --font:'Fredoka','Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;font-family:var(--font);font-size:1.1rem;line-height:1.5;color:var(--ink);
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 280px,#e9f9d5 281px,#b9e18b 100%);
  background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:280px;pointer-events:none;z-index:0;
  background:
    radial-gradient(60px 28px at 12% 60px,#fff 98%,transparent) ,
    radial-gradient(90px 34px at 30% 110px,#ffffffd9 98%,transparent),
    radial-gradient(70px 30px at 70% 70px,#fff 98%,transparent),
    radial-gradient(100px 36px at 88% 130px,#ffffffcc 98%,transparent)}
a{color:var(--info)}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 14px;border-radius:8px;z-index:99}
.skip:focus{left:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3{font-weight:700;line-height:1.2;margin:.2em 0 .4em}
h1{font-size:clamp(1.9rem,6vw,3rem)}
h2{font-size:clamp(1.4rem,4.5vw,2rem)}
h3{font-size:1.25rem}
p{margin:.5em 0}

/* letreros de madera */
.sign{background:linear-gradient(180deg,var(--wood-l),var(--wood));color:#fff;border:4px solid var(--wood-d);border-radius:var(--r);
  padding:10px 18px;box-shadow:0 5px 0 var(--wood-d),0 8px 14px #0003;text-shadow:0 2px 0 #0005}
.card{background:var(--cream);border:4px solid var(--wood-d);border-radius:var(--r);padding:16px 18px;box-shadow:0 6px 0 #0002;margin:14px 0}
.card.lawn-card{background:#f4ffe6}
.btn{font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer;color:#fff;text-shadow:0 2px 0 #0004;
  background:linear-gradient(180deg,#6bcb4d,var(--grass2));border:4px solid var(--grass-d);border-radius:999px;
  padding:12px 24px;min-height:48px;box-shadow:0 5px 0 var(--grass-d);transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--grass-d)}
.btn.sun{background:linear-gradient(180deg,#ffe27a,var(--sun-d));border-color:#a77700;box-shadow:0 5px 0 #a77700;color:#3b2a00;text-shadow:none}
.btn.wood{background:linear-gradient(180deg,var(--wood-l),var(--wood));border-color:var(--wood-d);box-shadow:0 5px 0 var(--wood-d)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--wood-d);box-shadow:0 5px 0 var(--wood-d);text-shadow:none}
.btn.small{padding:6px 14px;min-height:40px;font-size:1rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.center{justify-content:center}
.grow{flex:1}

/* barra superior */
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pill{background:#fffbe6;border:3px solid var(--wood-d);border-radius:999px;padding:4px 14px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.pill .sunico{font-size:1.3rem}

/* inicio */
.hero{text-align:center;padding:18px 8px 6px}
.hero h1{color:#fff;text-shadow:0 4px 0 var(--grass-d),0 6px 14px #0004;margin-bottom:0}
.hero .sub{display:inline-block;margin-top:10px;font-size:1.15rem}
.hero .sun-big{font-size:4rem;display:inline-block;animation:spin 18s linear infinite;filter:drop-shadow(0 4px 6px #0003)}
.exam-banner{background:#fff3b0;border:4px solid var(--sun-d);border-radius:var(--r);padding:10px 16px;text-align:center;font-weight:700;margin:12px 0}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:14px 0}
.menu .btn{flex-direction:column;padding:18px 14px;border-radius:26px;text-align:center}
.menu .btn .big{font-size:2.4rem;line-height:1}
.menu .btn small{font-weight:500;font-size:.9rem;text-shadow:none;opacity:.95}
.garden{display:flex;flex-wrap:wrap;gap:8px;font-size:2.2rem}
.garden .slot{width:60px;height:60px;display:grid;place-items:center;border-radius:12px;background:#8d5b2b;border:3px solid var(--wood-d);position:relative}
.garden .slot.locked{filter:grayscale(1) brightness(.6);opacity:.7}
.garden .slot span.need{position:absolute;bottom:-2px;right:2px;font-size:.7rem;background:#fff;border-radius:8px;padding:0 4px;color:var(--ink)}

/* mapa */
.world{margin:22px 0}
.world h2{display:flex;gap:10px;align-items:center;margin-bottom:2px}
.world .wd{margin:0 0 8px;color:var(--ink2);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;
  padding:14px;border-radius:var(--r);border:4px solid var(--grass-d);
  background:repeating-linear-gradient(90deg,var(--grass1) 0 64px,var(--grass2) 64px 128px)}
.tile{font:inherit;text-align:left;cursor:pointer;background:var(--cream);color:var(--ink);border:4px solid var(--wood-d);border-radius:16px;padding:10px 12px;
  box-shadow:0 5px 0 var(--wood-d);display:flex;flex-direction:column;gap:2px;min-height:112px;transition:transform .1s}
.tile:hover{transform:translateY(-3px)}
.tile .ti{font-size:2rem;line-height:1}
.tile .tt{font-weight:700;line-height:1.2}
.tile .tm{font-size:.9rem;color:var(--ink2)}
.tile.done{background:#e8ffd6;border-color:var(--ok)}
.stars{letter-spacing:2px;color:#c58a00;font-size:1.15rem}
.stars .off{color:#bbb}
.tag{display:inline-block;background:var(--infobg);color:var(--info);border:2px solid var(--info);border-radius:999px;padding:0 10px;font-size:.85rem;font-weight:700}
.tag.comp{background:#f1e6ff;color:#5b2aa0;border-color:#5b2aa0}

/* lección */
.indicator{background:var(--infobg);border-left:8px solid var(--info);padding:10px 14px;border-radius:10px;margin:10px 0}
.lesson p.ex,.ex{background:#fffbe0;border:2px dashed var(--sun-d);border-radius:10px;padding:8px 12px}
.lesson ul,.lesson ol{padding-left:1.3em}
.lesson li{margin:.3em 0}

/* batalla */
.lane{position:relative;height:150px;border-radius:var(--r);border:4px solid var(--grass-d);overflow:hidden;margin:10px 0;
  background:repeating-linear-gradient(90deg,var(--grass1) 0 20%,var(--grass2) 20% 40%);box-shadow:inset 0 -10px 0 #0001}
.lane .house{position:absolute;left:0;top:0;bottom:0;width:34px;background:linear-gradient(90deg,#8d5b2b,#a9763c);border-right:4px solid var(--wood-d);display:grid;place-items:center;font-size:1.4rem}
.unit{position:absolute;bottom:14px;font-size:4rem;line-height:1;transition:left .7s cubic-bezier(.3,1.4,.6,1),opacity .5s,transform .5s;filter:drop-shadow(0 6px 3px #0004)}
.plant{left:6%}
.zombie{left:78%}
.zombie .hat{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:2rem}
.zombie.near{left:24%}
.zombie.bite{animation:shake .4s 2}
.zombie.dead{opacity:0;transform:rotate(80deg) translateY(30px);left:60%}
.plant.hit{animation:shake .4s 2}
.plant.shoot{animation:pop .4s}
.pea{position:absolute;left:14%;bottom:60px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b6f58a,#3a9c2a);border:2px solid #1e6a15;animation:pea .55s linear forwards}
.boom{position:absolute;left:58%;bottom:50px;font-size:3rem;animation:pop .6s forwards}
.wave{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.wave span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--wood-d);font-size:.95rem}
.wave .ok{background:var(--okbg);border-color:var(--ok)}
.wave .bad{background:var(--badbg);border-color:var(--bad)}
.wave .cur{background:var(--sun);transform:scale(1.15)}
.qbox .txt{background:#fff;border:3px solid var(--wood-l);border-radius:12px;padding:10px 14px;margin:8px 0;white-space:pre-line;font-size:1.05rem}
.qbox h2{font-size:clamp(1.15rem,3.8vw,1.5rem);margin:.4em 0}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{font:inherit;text-align:left;cursor:pointer;background:#fff;color:var(--ink);border:4px solid var(--wood-l);border-radius:14px;padding:10px 14px;min-height:52px;
  display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--wood-l);transition:transform .08s}
.opt:hover:not([disabled]){transform:translateY(-2px);border-color:var(--wood-d)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sun);border:3px solid var(--sun-d);display:grid;place-items:center;font-weight:700}
.opt.right{background:var(--okbg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt[disabled]{cursor:default}
.opt.picked{background:#fff3b0;border-color:var(--sun-d)}
input.ans{font:inherit;width:100%;padding:12px 14px;border:4px solid var(--wood-l);border-radius:14px;font-size:1.2rem}
.fb{border-radius:14px;padding:12px 16px;margin-top:14px;border:4px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok);color:#1b4d1f}
.fb.bad{background:var(--badbg);border-color:var(--bad);color:#6d150f}
.fb h3{margin:0 0 4px}

/* resultados */
.big-stars{font-size:3rem;text-align:center;letter-spacing:6px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 52px;gap:10px;align-items:center}
.bar .track{height:20px;background:#e5e5e5;border-radius:999px;overflow:hidden;border:2px solid var(--wood-d)}
.bar .fill{height:100%;background:linear-gradient(90deg,#8fe05d,var(--grass2))}
.bar .fill.mid{background:linear-gradient(90deg,#ffe27a,var(--sun-d))}
.bar .fill.low{background:linear-gradient(90deg,#ff9a8f,#d8453a)}
.level{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:700;border:3px solid}
.level.av{background:var(--okbg);border-color:var(--ok);color:#1b4d1f}
.level.in{background:#fff3b0;border-color:#a77700;color:#5a4000}
.level.ini{background:var(--badbg);border-color:var(--bad);color:#6d150f}
details.rev{background:#fff;border:3px solid var(--wood-l);border-radius:12px;padding:8px 12px;margin:8px 0}
details.rev summary{cursor:pointer;font-weight:700}

/* auditoría */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:3px solid var(--wood-d);background:#fff}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.98rem}
th,td{padding:8px 10px;border-bottom:2px solid #eadcc0;text-align:left;vertical-align:top}
th{background:var(--wood);color:#fff;position:sticky;top:0}
td.num{text-align:center;font-weight:700}
.chip{display:inline-block;border-radius:999px;padding:0 10px;font-weight:700;font-size:.9rem;border:2px solid}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:#1b4d1f}
.chip.warn{background:#fff3b0;border-color:#a77700;color:#5a4000}
.chip.miss{background:var(--badbg);border-color:var(--bad);color:#6d150f}
.alert{background:#fff3b0;border:4px solid #a77700;border-radius:14px;padding:10px 14px;margin:12px 0}

footer{margin-top:30px;text-align:center;color:var(--ink2);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:8px 18px;z-index:50}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pea{from{left:14%}to{left:62%}}
@media (max-width:560px){
  body{font-size:1.02rem}
  .unit{font-size:3rem}
  .lane{height:120px}
  .bar{grid-template-columns:1fr 52px}.bar .lbl{grid-column:1/-1}.bar .track{grid-column:1}
  .btn{padding:10px 16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (forced-colors:active){.btn,.opt,.tile,.card{border:3px solid CanvasText}}
[data-focus]:focus,[data-focus]:focus-visible{outline:none}
button[data-focus]:focus-visible{outline:4px solid var(--focus)}

</style>
</head>
<body>
<a class="skip" href="#app">Saltar al contenido</a>
<div id="live" class="vh" role="status" aria-live="polite"></div>
<main id="app"><noscript><p class="card">Esta práctica necesita JavaScript activado.</p></noscript></main>
<script>
/* ===== BANCO DE CONTENIDOS (parte 1: Lectura, textos y gramática) ===== */
/* q(n, enunciado, [correcta, ...incorrectas], explicación, textoDeApoyo) — n: 1 conocimiento, 2 aplicación, 3 análisis */
/* w(n, enunciado, [respuestasAceptadas], explicación) — respuesta escrita */
const q = (n, p, o, e, txt) => ({ k: 'm', n, p, o, e, txt });
const w = (n, p, a, e, txt) => ({ k: 'w', n, p, a, e, txt });
const T_ = [];

/* ---------- MUNDO 0: LECTURA Y TEXTOS ---------- */
const FAB = "La cigarra cantó y bailó todo el verano. La hormiga, en cambio, trabajó sin descanso para guardar comida. Cuando llegó el invierno, la cigarra no tenía nada que comer y fue a pedirle ayuda a la hormiga.";
T_.push({
  id: 'i1', ind: '1', ap: '1.8', w: 0, t: 'La fábula', ic: '🦊',
  d: 'Identifica la fábula como un texto narrativo que presenta una enseñanza o moraleja.',
  l: [
    '<p>La <strong>fábula</strong> es un <strong>texto narrativo</strong> corto: cuenta una historia con personajes, lugar y hechos.</p>',
    '<ul><li>Sus personajes casi siempre son <strong>animales</strong> (o cosas) que piensan y hablan como personas.</li><li>Al final deja una <strong>moraleja</strong>: una enseñanza o consejo.</li></ul>',
    '<p class="ex">Ejemplo: «La liebre y la tortuga» → moraleja: <em>con constancia se alcanzan las metas</em>.</p>'
  ],
  q: [
    q(1, '¿Qué es una fábula?', ['Una narración breve con animales que actúan como personas y que deja una enseñanza', 'Un texto con pasos para armar un objeto', 'Un escrito que informa noticias recientes', 'Un poema con versos y rimas'], 'La fábula es un texto narrativo: cuenta una historia corta. Sus personajes suelen ser animales con cualidades humanas y al final deja una enseñanza.'),
    q(1, 'La enseñanza que deja una fábula al final se llama…', ['moraleja', 'título', 'saludo', 'onomatopeya'], 'La moraleja es el mensaje o consejo que nos deja la fábula.'),
    q(2, 'Marca la característica que NO corresponde a una fábula.', ['Informa noticias con datos reales y fechas exactas', 'Tiene animales con rasgos humanos', 'Es un relato corto', 'Termina con una moraleja'], 'Informar noticias con datos reales es propio del texto informativo. La fábula inventa una historia para enseñar algo.'),
    q(2, '«La liebre se burló de la tortuga por ser lenta. Pero la tortuga caminó sin detenerse y ganó la carrera.» ¿Cuál es la moraleja más adecuada?', ['Con constancia se logran las metas y no hay que burlarse de los demás.', 'Los animales rápidos siempre ganan.', 'Nunca hay que participar en carreras.', 'Las tortugas corren más que las liebres.'], 'La tortuga ganó por no rendirse y la liebre fue burlona. La moraleja habla de constancia y respeto, no de quién corre más.'),
    q(3, '¿Cuál fue la causa de que la cigarra no tuviera comida en invierno?', ['No guardó alimento durante el verano porque solo cantó y bailó', 'La hormiga le robó la comida', 'El invierno llegó muy temprano', 'La cigarra no sabía hablar'], 'El texto relaciona causa y efecto: como la cigarra no trabajó en verano (causa), en invierno no tuvo comida (efecto).', FAB),
    q(3, 'Según la fábula de la cigarra y la hormiga, ¿qué enseñanza transmite?', ['Hay que ser responsables y prevenir el futuro', 'Cantar es malo', 'Las hormigas son mejores que las cigarras', 'El invierno es una estación peligrosa'], 'La moraleja se deduce de lo que les pasa a los personajes: quien trabaja y se prepara, está listo para las dificultades.', FAB)
  ]
});

const LEY = "Cuentan los abuelos que, en las noches de luna llena, se oye cerca del río un llanto muy triste. Dicen que es el espíritu de una mujer que busca a su hijo perdido. Por eso, desde hace muchos años, los vecinos no se acercan al río después de las ocho de la noche.";
T_.push({
  id: 'i12', ind: '12', ap: '7.1', w: 0, t: 'La leyenda', ic: '🌙',
  d: 'Comprende el contenido de una leyenda, sus características y acontecimientos principales.',
  l: [
    '<p>La <strong>leyenda</strong> es un relato <strong>tradicional</strong>, contado de generación en generación (casi siempre de forma oral).</p>',
    '<ul><li>Mezcla <strong>hechos reales</strong> (un lugar, un río, un pueblo) con <strong>elementos fantásticos</strong> (espíritus, monstruos).</li><li>Suele explicar el origen de un lugar, de un fenómeno o dar una advertencia.</li><li>Tiene personajes, acontecimientos principales, lugar y tiempo.</li></ul>'
  ],
  q: [
    q(1, '¿Qué es una leyenda?', ['Un relato tradicional que mezcla hechos reales con elementos fantásticos', 'Una receta de cocina', 'Una noticia del periódico', 'Una carta a un familiar'], 'La leyenda nace en la tradición de un pueblo y combina realidad con fantasía.'),
    q(1, '¿Cómo se han transmitido las leyendas durante muchos años?', ['De forma oral, de abuelos a nietos', 'Solo por televisión', 'Únicamente por internet', 'Con mensajes de texto'], 'Antes de que se escribieran, las leyendas se contaban de boca en boca, de generación en generación.'),
    q(2, '¿Qué se oye cerca del río, según la leyenda?', ['Un llanto muy triste', 'Una canción alegre', 'El ladrido de un perro', 'Campanas de iglesia'], 'La información está explícita en la primera oración del texto: «se oye cerca del río un llanto muy triste».', LEY),
    q(2, '¿Por qué los vecinos no se acercan al río después de las ocho de la noche?', ['Por temor al espíritu que llora en las noches', 'Porque el río se seca', 'Porque no hay luz en el pueblo', 'Porque deben dormir temprano'], 'La leyenda explica y justifica una costumbre del pueblo: evitar el río de noche.', LEY),
    q(3, 'En la leyenda leída, ¿qué elemento es fantástico?', ['El espíritu de la mujer que busca a su hijo', 'El río', 'Los vecinos', 'La luna llena'], 'El río, los vecinos y la luna existen en la realidad. Un espíritu que llora es un elemento sobrenatural.', LEY),
    q(3, '¿Cuál es el acontecimiento principal de este relato?', ['Se oye por las noches el llanto de una mujer que busca a su hijo', 'Los vecinos construyen un puente', 'Un niño pesca en el río', 'Llega la época de lluvias'], 'El acontecimiento principal es el hecho alrededor del cual gira todo el relato: el llanto en el río.', LEY)
  ]
});

T_.push({
  id: 'i13', ind: '13', ap: '7.1', w: 0, t: 'Leyendas de Costa Rica', ic: '🇨🇷',
  d: 'Menciona el nombre de algunas leyendas que se cuentan en el país.',
  l: [
    '<ul><li><strong>La Llorona:</strong> espíritu de una mujer que llora por sus hijos cerca de los ríos de noche.</li><li><strong>La Carreta sin Bueyes:</strong> se oye el rechinar de una carreta sin que nadie la jale.</li><li><strong>El Cadejos:</strong> perro grande y peludo que aparece de noche.</li><li><strong>La Segua:</strong> mujer hermosa que se transforma en una calavera de caballo para asustar a quien anda de noche.</li><li><strong>El Padre sin Cabeza:</strong> fantasma de un sacerdote sin cabeza que aparece en caminos oscuros.</li><li><strong>La Tulevieja:</strong> ser misterioso que asusta cerca de ríos y quebradas.</li></ul>'

  function map() {
    app.innerHTML = header('inicio', 'Mapa del jardín') + `<p>Elige un tema. Primero lee el <strong>semillero</strong> (repaso) y luego defiende el jardín. Los temas <span class="tag comp">Aprendizaje esperado</span> completan el temario más allá de los indicadores numerados.</p>` +
      WORLDS.map((w, wi) => `<section class="world" aria-labelledby="w${wi}"><h2 id="w${wi}"><span aria-hidden="true">${w.ic}</span> ${w.n}</h2><p class="wd">${w.d}</p><div class="tiles">${T_.filter(t => t.w === wi).map(t => { const p = S.p[t.id]; return `<a class="tile ${p && p.stars >= 2 ? 'done' : ''}" href="#/leccion/${t.id}"><span class="ti" aria-hidden="true">${t.ic}</span><span class="tt">${t.t}</span><span class="tm">${t.ind === '·' ? '<span class="tag comp">Aprendizaje esperado ' + t.ap + '</span>' : '<span class="tag">Indicador ' + t.ind + '</span>'}</span><span>${starsHtml(p ? p.stars : 0)} ${p ? `<span class="tm">mejor: ${p.best}%</span>` : '<span class="tm">sin jugar</span>'}</span></a>`; }).join('')}</div></section>`).join('') +
      `<div class="row center"><button class="btn sun" data-act="exam" data-k="short">🧟 Simulacro corto</button><button class="btn wood" data-act="exam" data-k="full">🏆 Simulacro completo</button></div>`;
  }

  /* ---------- Lección ---------- */
  function lesson(id) {
    const t = T[id]; if (!t) { go('mapa'); return; }
    const c = [1, 2, 3].map(n => t.q.filter(x => x.n === n).length);
    app.innerHTML = header('mapa') + `<h1 class="sign" data-focus><span aria-hidden="true">${t.ic}</span> ${t.t}</h1>
    <div class="indicator"><strong>${t.ind === '·' ? 'Aprendizaje esperado ' + t.ap : 'Indicador ' + t.ind}</strong><br>${esc(t.d)}</div>
    <section class="card lesson" aria-labelledby="sem"><h2 id="sem">🌰 Semillero (repaso rápido)</h2>${t.l.join('')}</section>
    <section class="card"><h2>⚔️ Tu misión</h2><p>${t.q.length} preguntas en 3 niveles: ${LVI[1]} ${LV[1]} (${c[0]}), ${LVI[2]} ${LV[2]} (${c[1]}), ${LVI[3]} ${LV[3]} (${c[2]}). Cada respuesta te explica el porqué. Si fallas, la pregunta vuelve al final para que la intentes de nuevo.</p>
    <div class="row"><button class="btn" data-act="level" data-id="${t.id}">🌱 ¡Defender el jardín!</button><a class="btn ghost" href="#/mapa">Volver al mapa</a></div></section>`;
  }

  /* ---------- Juego ---------- */
  function mk(q, tid, retry) { return { q, t: tid, retry: !!retry, opts: q.k === 'm' ? shuffle(q.o.map((x, i) => ({ t: x, c: i === 0 }))) : null }; }
  function startLevel(id) {
    const t = T[id];
    const list = [1, 2, 3].flatMap(n => shuffle(t.q.filter(x => x.n === n)));
    G = { mode: 'level', id, queue: list.map(q => mk(q, id)), total: list.length, i: 0, res: [], answered: false, last: null, earned: 0, done: false };
    go('quiz');
  }
  function pickExam(per) {
    let out = [];
    T_.forEach(t => {
      const s = shuffle(t.q), got = [];
      s.forEach(q => { if (got.length < per && !got.some(g => g.n === q.n)) got.push(q); });
      s.forEach(q => { if (got.length < per && !got.includes(q)) got.push(q); });
      got.forEach(q => out.push(mk(q, t.id)));
    });
    return [1, 2, 3].flatMap(n => shuffle(out.filter(x => x.q.n === n)));
  }
  function startExam(kind) {
    const list = pickExam(kind === 'full' ? 2 : 1);
    G = { mode: 'exam', kind, queue: list, total: list.length, i: 0, res: [], answered: false, last: null, earned: 0, done: false };
    go('quiz');
  }

  function quiz() {
    const cur = G.queue[G.i]; const q = cur.q; const isEx = G.mode === 'exam';
    const t = T[cur.t]; const L = G.last;
    const plant = WORLDS[t.w].pl;
    const wave = Array.from({ length: G.total }, (_, k) => { const r = G.res[k]; return `<span class="${r ? (r.ok ? 'ok' : 'bad') : (k === Math.min(G.i, G.total - 1) ? 'cur' : '')}" aria-hidden="true">${r ? (r.ok ? '✓' : '✗') : k + 1}</span>`; }).join('');
    const scene = isEx ? '' : `<div class="lane" aria-hidden="true"><div class="house">🏠</div>
      <div class="unit plant ${L && L.ok ? 'shoot' : ''} ${L && !L.ok ? 'hit' : ''}">${plant}</div>
      <div class="unit zombie ${L ? (L.ok ? 'dead' : 'bite near') : ''}"><span class="hat">${ZHAT[q.n]}</span>🧟</div>
      ${L && L.ok ? '<div class="pea"></div><div class="boom">💥</div>' : ''}</div>`;
    let body;
    if (q.k === 'm') {
      body = `<div class="opts" role="group" aria-label="Opciones de respuesta">${cur.opts.map((o, i) => {
        let cls = '';
        if (L && !isEx) { if (o.c) cls = 'right'; else if (L.idx === i) cls = 'wrong'; } else if (L && L.idx === i) cls = 'picked';
        const mark = L && !isEx && o.c ? ' ✅ (correcta)' : L && !isEx && L.idx === i && !o.c ? ' ❌ (tu respuesta)' : L && isEx && L.idx === i ? ' (tu respuesta)' : '';
        return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${L ? 'disabled' : ''}><span class="k" aria-hidden="true">${i + 1}</span><span>${esc(o.t)}${mark}</span></button>`;
      }).join('')}</div>`;
    } else {
      body = `<form data-act="write" class="opts"><label for="ans" class="vh">Tu respuesta</label><input id="ans" class="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe tu respuesta aquí" value="${L ? esc(L.val) : ''}" ${L ? 'disabled' : ''}>${L ? '' : '<button class="btn" type="submit">Comprobar ✔</button>'}</form>`;
    }
    let fb = '';
    if (L && !isEx) {
      const correct = q.k === 'm' ? cur.opts.find(o => o.c).t : q.a[0];
      fb = L.ok
        ? `<div class="fb ok" role="status" id="fb"><h3>🌟 ¡Correcto! +${cur.retry ? 10 : 25} ☀️</h3><p>${esc(q.e)}</p><button class="btn" data-act="next" data-focus>${G.i + 1 >= G.queue.length ? 'Ver resultados' : 'Siguiente zombi →'}</button></div>`
        : `<div class="fb bad" role="status" id="fb"><h3>🧟 ¡Casi! Respuesta correcta: «${esc(correct)}»</h3><p>${esc(q.e)}</p>${cur.retry ? '' : '<p><strong>Esta pregunta volverá al final para que la practiques otra vez.</strong></p>'}<button class="btn" data-act="next" data-focus>${G.i + 1 >= G.queue.length ? 'Ver resultados' : 'Siguiente zombi →'}</button></div>`;
    } else if (L && isEx) {
      fb = `<div class="row" style="margin-top:14px"><button class="btn" data-act="next" data-focus>${G.i + 1 >= G.queue.length ? 'Terminar simulacro' : 'Siguiente →'}</button></div>`;
    }
    app.innerHTML = `<div class="top"><button class="btn ghost small" data-act="quit">✖ Salir</button><span class="grow"></span><span class="pill"><span aria-hidden="true">☀️</span>${S.sun + G.earned}<span class="vh"> soles</span></span></div>
    <div class="sign" style="padding:6px 16px"><strong>${isEx ? (G.kind === 'full' ? 'Simulacro completo' : 'Simulacro corto') : esc(t.t)}</strong> · Pregunta ${Math.min(G.i + 1, G.queue.length)} de ${G.queue.length}</div>
    <div class="wave" aria-hidden="true">${wave}</div>
    ${scene}
    <section class="card qbox" aria-labelledby="qq">
      <span class="tag">${LVI[q.n]} Nivel: ${LV[q.n]}</span> ${isEx ? `<span class="tag comp">${esc(t.t)}</span>` : ''}
      ${q.txt ? `<div class="txt" role="region" aria-label="Texto de apoyo">${esc(q.txt)}</div>` : ''}
      <h2 id="qq" ${!L ? 'data-focus' : ''}>${esc(q.p)}</h2>
      ${body}${fb}
      ${!isEx ? `<details style="margin-top:14px"><summary>📖 ¿Necesitas repasar? Ver semillero</summary><div class="lesson">${t.l.join('')}</div></details>` : ''}
    </section>`;
    if (L) { const n = app.querySelector('[data-act="next"]'); if (n) n.focus(); }
    else { const i = app.querySelector('#ans'); if (i) i.focus(); }
  }

  function submit(idx, val) {
    if (G.last) return;
    const cur = G.queue[G.i], q = cur.q; let ok;
    if (q.k === 'm') ok = cur.opts[idx].c; else ok = q.a.some(a => norm(a) === norm(val));
    G.last = { ok, idx, val };
    if (!cur.retry) G.res.push({ id: cur.t, n: q.n, ok, q, ans: q.k === 'm' ? cur.opts[idx].t : val, cor: q.k === 'm' ? cur.opts.find(o => o.c).t : q.a[0] });
    else { const r = G.res.find(r => r.q === q); if (r) r.fixed = ok; }
    if (G.mode === 'level') {
      if (ok) { G.earned += cur.retry ? 10 : 25; sndOk(); say('¡Correcto!'); }
      else { sndBad(); say('Incorrecto'); if (!cur.retry) { G.queue.push(mk(q, cur.t, true)); } }
    }
    quiz();
  }
  function next() {
    G.i++; G.last = null; G.pick = undefined;
    if (G.i >= G.queue.length) { finish(); return; }
    quiz();
  }
  function finish() {
    G.done = true;
    const ok = G.res.filter(r => r.ok).length, tot = G.res.length;
    G.pct = Math.round(100 * ok / tot);
    if (G.mode === 'level') {
      const bonus = 50; G.earned += bonus;
      const p = S.p[G.id] || { best: 0, stars: 0, tries: 0 };
      p.best = Math.max(p.best, G.pct); p.stars = Math.max(p.stars, starsOf(G.pct)); p.tries++; S.p[G.id] = p;
    } else {
      const k = G.kind; const e = S.ex[k] || { best: 0, tries: 0 }; e.best = Math.max(e.best, G.pct); e.tries++; S.ex[k] = e;
      G.earned += G.kind === 'full' ? 150 : 75;
    }
    S.sun += G.earned; save();
    go('resultados');
  }

  /* ---------- Resultados ---------- */
  function results() {
    const pc = G.pct, [lv, lc, ld] = perf(pc), ok = G.res.filter(r => r.ok).length;
    const byN = [1, 2, 3].map(n => { const a = G.res.filter(r => r.n === n); const o = a.filter(r => r.ok).length; return { n, tot: a.length, ok: o, p: a.length ? Math.round(100 * o / a.length) : 0 }; });
    const bar = (label, p, extra) => `<div class="bar"><span class="lbl">${label}</span><div class="track" role="img" aria-label="${p}%"><div class="fill ${p >= 80 ? '' : p >= 60 ? 'mid' : 'low'}" style="width:${p}%"></div></div><strong>${p}%</strong></div>`;
    let extra = '';
    if (G.mode === 'exam') {
      const byT = T_.map(t => { const a = G.res.filter(r => r.id === t.id); const o = a.filter(r => r.ok).length; return { t, tot: a.length, p: a.length ? Math.round(100 * o / a.length) : 0 }; }).filter(x => x.tot);
      const weak = byT.filter(x => x.p < 70);
      extra = `<section class="card"><h2>📊 Resultado por tema</h2><div class="bars">${byT.map(x => bar(`${x.t.ic} ${x.t.t} (${x.tot})`, x.p)).join('')}</div></section>
      <section class="card"><h2>🎯 A reforzar</h2>${weak.length ? `<ul>${weak.map(x => `<li><a href="#/leccion/${x.t.id}">${x.t.ic} ${x.t.t}</a> — ${x.p}%</li>`).join('')}</ul>` : '<p>¡Excelente! No hay temas por debajo del 70 %. Repasa los errores de abajo y estarás listo.</p>'}</section>`;
    }
    const wrong = G.res.filter(r => !r.ok);
    const rev = `<section class="card"><h2>📝 Revisión de errores (${wrong.length})</h2>${wrong.length ? wrong.map(r => `<details class="rev"><summary>${esc(T[r.id].t)}: ${esc(r.q.p)}</summary>${r.q.txt ? `<p class="txt" style="white-space:pre-line">${esc(r.q.txt)}</p>` : ''}<p>❌ Tu respuesta: <strong>${esc(r.ans || '(sin respuesta)')}</strong></p><p>✅ Correcta: <strong>${esc(r.cor)}</strong></p><p>💡 ${esc(r.q.e)}</p></details>`).join('') : '<p>🎉 ¡Sin errores!</p>'}</section>`;
    const idx = G.mode === 'level' ? T_.findIndex(t => t.id === G.id) : -1;
    const nx = idx >= 0 && T_[idx + 1] ? T_[idx + 1] : null;
    app.innerHTML = header('mapa') + `<h1 class="sign" data-focus>${pc >= 70 ? '🏆 ¡Jardín defendido!' : '🧟 Los zombis casi entran…'}</h1>
    <section class="card"><div class="big-stars" aria-label="${starsOf(pc)} de 3 estrellas">${'⭐'.repeat(starsOf(pc))}${'☆'.repeat(3 - starsOf(pc))}</div>
      <p style="text-align:center;font-size:1.4rem"><strong>${ok} de ${G.res.length} correctas (${pc} %)</strong> · +${G.earned} ☀️</p>
      <p style="text-align:center"><span class="level ${lc}">Nivel de desempeño: ${lv}</span></p><p style="text-align:center">${ld} <em>(escala de práctica referencial)</em></p></section>
    <section class="card"><h2>🧭 Por nivel cognitivo</h2><div class="bars">${byN.filter(x => x.tot).map(x => bar(`${LVI[x.n]} ${LV[x.n]} (${x.ok}/${x.tot})`, x.p)).join('')}</div></section>
    ${extra}${rev}
    <div class="row center">${G.mode === 'level' ? `<button class="btn" data-act="level" data-id="${G.id}">🔁 Reintentar</button>${nx ? `<a class="btn sun" href="#/leccion/${nx.id}">Siguiente tema →</a>` : ''}` : `<button class="btn" data-act="exam" data-k="${G.kind}">🔁 Nuevo simulacro</button>`}<a class="btn ghost" href="#/mapa">Mapa del jardín</a></div>`;
  }

  /* ---------- Auditoría ---------- */
  function audit() {
    const cnt = t => [1, 2, 3].map(n => t.q.filter(x => x.n === n).length);
    const rows = T_.map(t => { const c = cnt(t); const ok = c.every(x => x >= 1) && t.q.length >= 5; return `<tr><td>${t.ind === '·' ? '—' : t.ind}</td><td>${t.ap}</td><td>${esc(t.d)}</td><td><a href="#/leccion/${t.id}">${t.ic} ${t.t}</a></td><td class="num">${c[0]}</td><td class="num">${c[1]}</td><td class="num">${c[2]}</td><td class="num">${t.q.length}</td><td><span class="chip ${ok ? 'ok' : 'warn'}">${ok ? '✔ Cubierto' : '⚠ Reforzar'}</span></td></tr>`; }).join('');
    const orden = T_.filter(t => t.ind !== '·').sort((a, b) => a.ind - b.ind).map(t => t.ind);
    const total = T_.reduce((a, t) => a + t.q.length, 0);
    const cr = CONTENIDOS.map(c => { const t = T[c[2]]; return `<tr><td>${c[0]}</td><td>${esc(c[1])}</td><td><a href="#/leccion/${t.id}">${t.ic} ${t.t}</a></td><td class="num">${t.q.length}</td><td><span class="chip ${t.q.length >= 5 ? 'ok' : 'warn'}">${t.q.length >= 5 ? '✔' : '⚠'}</span></td></tr>`; }).join('');
    app.innerHTML = header('inicio', '🔍 Auditoría del temario') + `
    <section class="card"><h2>Resumen</h2><p><strong>${orden.length}</strong> indicadores del temario (${orden.join(', ')}) + <strong>${T_.length - orden.length}</strong> temas del «Aprendizaje esperado» que no tienen número de indicador = <strong>${T_.length}</strong> temas y <strong>${total}</strong> preguntas. Cada tema incluye preguntas de los tres niveles: conocimiento, aplicación y análisis.</p>
    <div class="alert" role="note"><strong>ℹ Nota sobre la numeración:</strong> en el temario la numeración salta del indicador <strong>8</strong> al <strong>12</strong>. Los contenidos que aparecen sin número de indicador (los de la columna «Aprendizaje esperado») están cubiertos por los ${T_.length - orden.length} temas marcados «Aprendizaje esperado» y se verifican en la tabla 2.</div></section>
    <section class="card"><h2>1) Indicadores ↔ preguntas</h2><div class="tbl-wrap"><table><caption class="vh">Indicadores y preguntas por nivel</caption><thead><tr><th>Ind.</th><th>Ap.</th><th>Indicador (texto del temario)</th><th>Tema</th><th title="Conocimiento">🌱</th><th title="Aplicación">🌻</th><th title="Análisis">🌵</th><th>Total</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div><p>🌱 Conocimiento · 🌻 Aplicación · 🌵 Análisis y resolución de problemas</p></section>
    <section class="card"><h2>2) Contenidos del «Aprendizaje esperado» ↔ tema</h2><div class="tbl-wrap"><table><caption class="vh">Contenidos y su cobertura</caption><thead><tr><th>Ap.</th><th>Contenido</th><th>Tema que lo cubre</th><th>Preguntas</th><th>Estado</th></tr></thead><tbody>${cr}</tbody></table></div></section>`;
  }

  /* ---------- Ayuda ---------- */
  function help() {
    app.innerHTML = header('inicio', '❓ Cómo estudiar') + `
    <section class="card"><h2>🎮 Cómo se juega</h2><ol><li>Elige un tema en el mapa y lee el <strong>semillero</strong>.</li><li>Cada pregunta es un zombi: si aciertas, tu planta lo derrota y ganas ☀️. Si fallas, lees la explicación y la pregunta vuelve al final.</li><li>Gana ⭐ según tu porcentaje: 50 % = 1, 70 % = 2, 90 % = 3. Con las ⭐ desbloqueas plantas en tu jardín.</li><li>Atajo de teclado: pulsa 1, 2, 3 o 4 para elegir una opción.</li></ol></section>
    <section class="card"><h2>🗓 Plan rápido de repaso</h2><ol><li><strong>Diagnóstico:</strong> haz el simulacro corto.</li><li><strong>Refuerzo:</strong> repasa los temas con menos del 70 % (se muestran al final del simulacro).</li><li><strong>Ortografía:</strong> practica B/V, C/S/Z, G/J, R/RR, hiato y diptongo: son muchos indicadores.</li><li><strong>Cierre:</strong> haz el simulacro completo y revisa los errores.</li></ol></section>
    <section class="card"><h2>📐 Niveles de desempeño (referencial)</h2><p><span class="level ini">Inicial</span> menos de 60 % · <span class="level in">Intermedio</span> 60 % a 84 % · <span class="level av">Avanzado</span> 85 % o más.</p><p>Las preguntas avanzan de <strong>conocimiento</strong> (recordar) a <strong>aplicación</strong> (usar en una situación) y <strong>análisis</strong> (razonar, corregir, resolver). Es una práctica de estudio; la calificación oficial la define la docente.</p></section>
    <section class="card"><h2>⚙️ Ajustes</h2><div class="row"><button class="btn ghost" data-act="snd">${S.snd ? '🔊 Sonido: activado' : '🔇 Sonido: desactivado'}</button><button class="btn ghost" data-act="reset">🗑 Borrar mi progreso</button></div><p>Tu progreso se guarda solo en este navegador.</p></section>`;
  }

  /* ---------- Eventos ---------- */
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'FORM') return;
    const a = b.dataset.act;
    if (a === 'level') startLevel(b.dataset.id);
    else if (a === 'exam') startExam(b.dataset.k);
    else if (a === 'pick') { const i = +b.dataset.i; submit(i); }
    else if (a === 'next') next();
    else if (a === 'quit') { if (confirm('¿Salir de esta práctica? Se perderá el avance de esta partida.')) { G = null; go('mapa'); } }
    else if (a === 'snd') { S.snd = !S.snd; save(); help(); }
    else if (a === 'reset') { if (confirm('¿Borrar estrellas, soles y progreso?')) { S = { sun: 0, p: {}, ex: {}, snd: S.snd }; save(); help(); } }
  });
  app.addEventListener('submit', e => { e.preventDefault(); const inp = app.querySelector('#ans'); if (inp && G && !G.last) { if (!inp.value.trim()) { inp.focus(); return; } submit(0, inp.value); } });
  document.addEventListener('keydown', e => {
    if (!G || location.hash !== '#/quiz' || G.last || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[1-4]$/.test(e.key) && document.activeElement.tagName !== 'INPUT') { const o = G.queue[G.i].opts; if (o && o[+e.key - 1]) submit(+e.key - 1); }
  });
  route();
})();

</script>
</body>
</html>
